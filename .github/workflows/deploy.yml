# Deploy job: bornagojsic/ci-templates deploy-pages.yml (Cloudflare Pages project `grapher`).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    uses: bornagojsic/ci-templates/.github/workflows/deploy-pages.yml@main
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
