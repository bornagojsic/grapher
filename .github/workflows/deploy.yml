# Deploys to the Cloudflare Pages project `grapher` (server-spec #117).
# Same steps as bornagojsic/ci-templates deploy-pages.yml, inlined: this repository is public
# and cannot call a reusable workflow from a private one.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # A manual run from another branch must not deploy.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    # One deploy at a time; a running deploy is never cancelled.
    concurrency:
      group: deploy-grapher
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name grapher --branch main
